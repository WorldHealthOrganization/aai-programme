name: Pull beans

# Rebuilds pulled/ from the repositories in beans-sources.json, then checks
# the programme issues against those beans (bean drift, pulled/drift.md).
# Every source is public, so the default token only needs to write this
# repository and read its issues. Run by hand: Actions -> Pull beans -> Run
# workflow, or comment `/check-drift` on any issue (check-drift.yml).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: pull-beans
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Pull beans
        run: bun run scripts/pull-beans.ts
      - name: Check the programme issues against the beans
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/programme/bean-drift.ts --out pulled
      - name: Commit the board if it changed
        run: |
          if git diff --quiet -- pulled; then
            echo "board unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulled
          git commit -m "Pull beans and check drift"
          git push
