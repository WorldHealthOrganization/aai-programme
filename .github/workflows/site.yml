# Build this repository's site and put it on gh-pages, which GitHub Pages
# serves (Settings -> Pages -> Deploy from a branch: gh-pages, / (root)).
#
#   push to main  -> the gh-pages root:      https://litlfred.github.io/aai-programme/
#   pull request  -> STAGING/<branch>/:      https://litlfred.github.io/aai-programme/STAGING/<branch>/
#
# The root build replaces everything at the root EXCEPT `ns/` (the JSON-LD
# context, written by publish-context.yml), `STAGING/` (every open pull
# request's preview) and `.nojekyll`. A preview replaces only its own folder.
# Previews are not removed when a pull request closes: deleting one is a
# decision for a person, not this workflow.
name: Site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  site:
    # A pull request from a fork gets a read-only token, so it cannot deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Where it goes
        id: dest
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            slug=$(printf '%s' "$HEAD_REF" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')
            case "$slug" in ""|.|..) echo "::error::unsafe branch slug '$slug'"; exit 1 ;; esac
            echo "dir=STAGING/$slug" >> "$GITHUB_OUTPUT"
            echo "preview=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "preview=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          PREVIEW: ${{ steps.dest.outputs.preview }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIEW" ]; then
            bun run scripts/build-site.ts --out _site --repo "$GITHUB_REPOSITORY" --ref "$SHA" --preview "$PREVIEW"
          else
            bun run scripts/build-site.ts --out _site --repo "$GITHUB_REPOSITORY" --ref "$SHA"
          fi
      - name: Deploy to gh-pages
        env:
          DIR: ${{ steps.dest.outputs.dir }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # publish-context.yml writes gh-pages too, so a push can lose a race:
          # start again from the new tip, at most five times.
          for attempt in 1 2 3 4 5; do
            rm -rf pages
            if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
              git clone -q --depth 1 --branch gh-pages "$url" pages
            else
              git init -q pages && git -C pages checkout -q --orphan gh-pages && git -C pages remote add origin "$url"
            fi
            if [ "$DIR" = "." ]; then
              find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name ns ! -name STAGING ! -name .nojekyll -exec rm -rf {} +
            else
              rm -rf "pages/$DIR"
            fi
            mkdir -p "pages/$DIR"
            cp -R _site/. "pages/$DIR/"
            touch pages/.nojekyll
            git -C pages add -A
            if git -C pages diff --cached --quiet; then echo "site unchanged"; exit 0; fi
            git -C pages commit -q -m "site($DIR): from $SHA"
            if git -C pages push -q origin gh-pages; then exit 0; fi
            echo "push lost a race; retrying ($attempt)"
            sleep $((attempt * 3))
          done
          echo "::error::could not push gh-pages after 5 attempts"
          exit 1
      - name: Link the preview on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIR: ${{ steps.dest.outputs.dir }}
        with:
          script: |
            const marker = "<!-- site-preview -->";
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/${process.env.DIR}/`;
            const body = `${marker}\n**Preview:** ${url}\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)}. Main is at https://${context.repo.owner}.github.io/${context.repo.repo}/.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
