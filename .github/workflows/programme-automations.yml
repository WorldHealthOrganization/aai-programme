# The programme automations the requirements call for (section 11): GitHub
# Actions by requirement, not site publishing, which is agent-run (owner,
# 2026-10-10). Each step runs a script in scripts/programme/ whose decisions
# are in rules.ts and tested in rules.test.ts. What each does, its trigger,
# scope and owner: README, "Programme automations" (AUTO-07).
#
# Needs the PROGRAMME_TOKEN secret: a token with read and write access to
# Projects for the project's owner, and to this repository's issues. The
# default token cannot write a user's or an organisation's project. Without
# it every job stops and says so (AUTO-09).
name: Programme automations

on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Which to run"
        type: choice
        options: [health-and-validation, backfill]
        default: health-and-validation
      dry_run:
        description: "Say what would change, change nothing"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: programme-automations-${{ github.event.issue.number || github.event_name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROGRAMME_TOKEN }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
    steps:
      - name: Stop if the token is missing (AUTO-09)
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the PROGRAMME_TOKEN secret is not set: it needs read and write access to Projects for the project's owner, and to this repository's issues"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: AUTO-03 Programme status
        if: github.event_name == 'issues'
        run: bun run scripts/programme/auto-03-status.ts
      - name: AUTO-04 Delivery health roll-up
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run == 'health-and-validation')
        run: bun run scripts/programme/auto-04-health.ts $DRY
      - name: AUTO-10 Validation check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run == 'health-and-validation')
        run: bun run scripts/programme/auto-10-validation.ts $DRY
      - name: AUTO-11 Backfill
        if: github.event_name == 'workflow_dispatch' && inputs.run == 'backfill'
        run: bun run scripts/programme/auto-11-backfill.ts $DRY
