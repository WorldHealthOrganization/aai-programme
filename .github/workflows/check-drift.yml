# Check bean drift on demand: comment `/check-drift` on any issue or pull
# request in this repository. The same as the daily Pull beans run, and the
# summary is posted back as a reply. Only comments from someone with write
# access (owner, member, collaborator) start it. No token beyond the
# workflow's own.
name: Check drift

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: pull-beans
  cancel-in-progress: false

jobs:
  check:
    if: >-
      startsWith(github.event.comment.body, '/check-drift')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Pull beans
        run: bun run scripts/pull-beans.ts
      - name: Check drift and reply
        run: bun run scripts/programme/bean-drift.ts --out pulled --comment ${{ github.event.issue.number }}
      - name: Commit the report if it changed
        run: |
          if git diff --quiet -- pulled; then
            echo "report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulled
          git commit -m "Pull beans and check drift (/check-drift on #${{ github.event.issue.number }})"
          git pull --rebase -q origin main
          git push
